---
# Avrana fork: test, then build the image from an avrana/* branch (upstream's ci.yml runs its jobs only on pull
# requests and develop, so this workflow repeats its lint, format and unit-test steps first).
# Image: ghcr.io/<owner>/seerr:<branch>-<sha7> (linux/amd64, the avrana host). Deploys pin it BY DIGEST, which the
# image job writes to the run summary. Nothing here runs for upstream branches.
name: Avrana image

on:
  push:
    branches: ['avrana/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, format & unit tests
    runs-on: ubuntu-24.04
    container: node:22.22.2-alpine3.23@sha256:8ea2348b068a9544dae7317b4f3aafcdc032df1647bb7d768a05a5cad1a7683f
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Unit tests
        env:
          CI: true
        run: pnpm test

  image:
    name: Build & push image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          safe=$(printf '%s' "$BRANCH" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          echo "tag=${safe}-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/seerr" >> "$GITHUB_OUTPUT"
          echo "ts=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=${{ steps.tag.outputs.tag }}
            SOURCE_DATE_EPOCH=${{ steps.tag.outputs.ts }}
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Digest
        env:
          REF: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          PINNED: ${{ steps.tag.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          echo "### $REF" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$PINNED\`" >> "$GITHUB_STEP_SUMMARY"
